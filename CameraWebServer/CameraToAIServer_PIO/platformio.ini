; =============================================================================
; PlatformIO Configuration for ESP32-S3-CAM eKYC Streaming (240x240)
; Based on esp32cam-rtsp board definition (16MB Flash, 8MB OPI PSRAM)
; =============================================================================

[platformio]
default_envs = esp32cam_s3_wroom_n16r8

[env]
platform = espressif32
framework = arduino
upload_port = COM7
monitor_port = COM7
monitor_speed = 115200
upload_speed = 921600
monitor_rts = 0
monitor_dtr = 0
monitor_filters = time, default, esp32_exception_decoder

; =============================================================================
; Environment mặc định: ESP32-S3 WROOM N16R8 (16MB Flash, 8MB Octal PSRAM)
; Sử dụng file boards/esp32cam_s3_wroom_n16r8.json
; =============================================================================
[env:esp32cam_s3_wroom_n16r8]
board = esp32cam_s3_wroom_n16r8
board_build.partitions = default_16MB.csv
build_flags =
    -O2
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0

; =============================================================================
; Environment dự phòng: Sử dụng board chuẩn esp32-s3-devkitc-1
; =============================================================================
[env:esp32s3_devkitc1]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv   
build_flags =
    -O2
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
